name: Build Windows EXE

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Empacotar em ZIP
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath imgmanipulator-windows.zip
        shell: pwsh

      - name: Upload artifact (sempre)
        uses: actions/upload-artifact@v4
        with:
          name: imgmanipulator-windows
          path: imgmanipulator-windows.zip
          if-no-files-found: error

      - name: Publicar Release (só em tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: imgmanipulator-windows.zip
          generate_release_notes: true
